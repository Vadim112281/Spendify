services:
  postgres:
    image: postgres:16-alpine
    container_name: spendify-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy docker/.env.template to docker/.env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-SpendifyDb}
    volumes:
      - spendify_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spendify_pg_data:
